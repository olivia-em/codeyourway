<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script defer src="sketch.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #ddd; /* Light gray background */
      }
      #controls {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 10px;
      }
      #container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: calc(100vh - 50px); /* Adjust for input field height */
      }
      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- Input & Button -->
    <div id="controls">
      <input id="i1" type="text" placeholder="type shit" />
      <button onclick="myClear()">clear shit</button>
    </div>

    <!-- Canvas Wrapper -->
    <div id="container"></div>
  </body>
</html>
